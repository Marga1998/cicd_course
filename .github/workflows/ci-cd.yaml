name: CI Workflow
on:
  push:
    branch: olt

jobs:
  build:
    name: Build Frontend Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6  # github.com/marketplace/actions/checkout

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6  # github.com/marketplace/actions/setup-node-js-environment
        with:
          node-version: 16.x

      - name: Install Dependencies and Transpile Code
        run: cd frontend && npm i

      - name: Transpile the code
        run: cd frontend && npm run build  # cd into frontend again bc new step = new terminal

      - name: Send to Holding Area
        uses: actions/upload-pages-artifact@v3  # https://github.com/marketplace/actions/upload-github-pages-artifact
        with:
          path: frontend/build
